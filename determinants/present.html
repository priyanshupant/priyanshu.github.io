<script>
const S=[{"v": "presentation_assets/s00_be2145e0a6960632.mp4", "t": "", "s": "Opening"}, {"v": "presentation_assets/s00_3455bc0d0338e337.mp4", "t": "You've met the determinant. For a two-by-two matrix, it's a d minus b c.", "s": "Opening"}, {"v": "presentation_assets/s00_77376d576713e7d0.mp4", "t": "It's how we check whether equations have a unique solution, find eigenvalues, and change variables in integrals.", "s": "Opening"}, {"v": "presentation_assets/s00_6086b0016982446f.mp4", "t": "But here's something it does that most courses never mention. It counts.", "s": "Opening"}, {"v": "presentation_assets/s00_1398ea9c4c836e0a.mp4", "t": "How many ways can you tile a chessboard with dominoes? About thirteen million. If you listed them, one every second, you'd be at it for five months.", "s": "Opening"}, {"v": "presentation_assets/s00_4a4cf2a652bc660f.mp4", "t": "A determinant gives you the exact number, instantly. So how can a formula possibly count?", "s": "Opening"}, {"v": "presentation_assets/s01_17dd7ce730078821.mp4", "t": "Let's start with the smallest example I know. Meet two ants. They live on a grid.", "s": "Hook"}, {"v": "presentation_assets/s01_7db861ec11064737.mp4", "t": "Every step goes one dot right, or one dot up. Never left, never down.", "s": "Hook"}, {"v": "presentation_assets/s01_512d09be34706694.mp4", "t": "The blue ant, ant one, lives here. The orange ant, ant two, lives there.", "s": "Hook"}, {"v": "presentation_assets/s01_9a33c3a864bbba97.mp4", "t": "There's one small problem. They had a fight. Now neither will set foot on any dot the other one walks on. Not even later: ants leave a scent trail.", "s": "Hook"}, {"v": "presentation_assets/s01_91bbb4bc397c667f.mp4", "t": "So their two routes can't touch, anywhere. How many pairs of routes get both ants home?", "s": "Hook"}, {"v": "presentation_assets/s01_3376ce4f2248d108.mp4", "t": "Maybe pause, and try to find one.", "s": "Hook"}, {"v": "presentation_assets/s02_ebf3cf2afbdfa2a6.mp4", "t": "Here's one. Ant one goes up first, ant two goes right first.", "s": "OneGoodPair"}, {"v": "presentation_assets/s02_507c49d875ca254b.mp4", "t": "They never meet. Peace in our time.", "s": "OneGoodPair"}, {"v": "presentation_assets/s03_e17c1f96adb2e5e7.mp4", "t": "To find them all, the honest way: each ant has six routes, so thirty-six pairs.", "s": "BruteForce"}, {"v": "presentation_assets/s03_e154ff85834551f2.mp4", "t": "Check them one by one. This pair never meets. This one meets. So does this one. And so on.", "s": "BruteForce"}, {"v": "presentation_assets/s03_2e24510fd97521c2.mp4", "t": "Twenty pairs never meet.", "s": "BruteForce"}, {"v": "presentation_assets/s04_c9bc0e3549d89be4.mp4", "t": "Now something that looks completely unrelated. Count the routes from each ant to each home, and put those four numbers in a little square.", "s": "TableAndDet"}, {"v": "presentation_assets/s04_8906030e8a8bd359.mp4", "t": "Take the determinant: six times six, minus four times four.", "s": "TableAndDet"}, {"v": "presentation_assets/s04_559acad61f75e0d5.mp4", "t": "Twenty.", "s": "TableAndDet"}, {"v": "presentation_assets/s04_bbfa8250a20463dd.mp4", "t": "The same twenty. Coincidence? Hardly. Let's find out why.", "s": "TableAndDet"}, {"v": "presentation_assets/s05_230cb202e93409ee.mp4", "t": "First, those four numbers. How many ways can ant one get home? Take a guess.", "s": "ListRoutes"}, {"v": "presentation_assets/s05_2aaa5e7c6fc0f83c.mp4", "t": "Let's list them. Right, right, up, up. Right, up, right, up. Right, up, up, right. Up, right, right, up. Up, right, up, right. And up, up, right, right.", "s": "ListRoutes"}, {"v": "presentation_assets/s05_623f255dfe116ee7.mp4", "t": "Six.", "s": "ListRoutes"}, {"v": "presentation_assets/s05_67e7894060bd4eed.mp4", "t": "Notice: every route is four steps, two right and two up. That's forced: home is two columns right and two rows up.", "s": "ListRoutes"}, {"v": "presentation_assets/s06_d226a6f38168187e.mp4", "t": "So a route is just a choice of which two of the four steps go right.", "s": "Slots"}, {"v": "presentation_assets/s06_bbf228e4e011e7e9.mp4", "t": "Four choose two: six.", "s": "Slots"}, {"v": "presentation_assets/s06_7ca1ad832de952f3.mp4", "t": "The same works for any start and home: a steps right and b steps up gives a plus b choose a routes.", "s": "Slots"}, {"v": "presentation_assets/s06_519becc300b32f02.mp4", "t": "Ant one to its own home: six. To the other home: four. Ant two to the first home: four. To its own: six. That's our little square.", "s": "Slots"}, {"v": "presentation_assets/s07_9e78bc939e26b1b1.mp4", "t": "Here's the thing that bugged me when I first saw this. Six times six counts every way to send each ant to its own home, including the pairs that crash into each other.", "s": "ReadCounts"}, {"v": "presentation_assets/s07_cf459fc200941b20.mp4", "t": "Twenty good, sixteen bad.", "s": "ReadCounts"}, {"v": "presentation_assets/s07_bb0c8317d550f55a.mp4", "t": "Four times four counts something stranger: each ant walking to the other one's house.", "s": "ReadCounts"}, {"v": "presentation_assets/s07_155faad9cff0695e.mp4", "t": "So the determinant is good, plus bad, minus swapped. For that to equal the good ones, the swapped pairs must cancel the bad ones exactly. Not roughly. Exactly. Let's match them up.", "s": "ReadCounts"}, {"v": "presentation_assets/s08_9602e2084614c0b3.mp4", "t": "Take a bad pair.", "s": "SwapPaths"}, {"v": "presentation_assets/s08_aa04f189f9605768.mp4", "t": "Walk along ant one's route, and stop at the first dot that ant two also visits.", "s": "SwapPaths"}, {"v": "presentation_assets/s08_bb4780cbe9b3b50f.mp4", "t": "From that dot on, swap their tails. Ant one keeps its start and takes ant two's ending; ant two does the opposite.", "s": "SwapPaths"}, {"v": "presentation_assets/s08_a892f5fd8297a8d3.mp4", "t": "Look where they end: each at the other's house. A bad pair became a swapped pair.", "s": "SwapPaths"}, {"v": "presentation_assets/s09_95a2a934400daa17.mp4", "t": "And it undoes itself.", "s": "SwapTwice"}, {"v": "presentation_assets/s09_e54ab6b099e8425d.mp4", "t": "Nothing before that dot changed, so it's still the first meeting point, and swapping there puts everything back.", "s": "SwapTwice"}, {"v": "presentation_assets/s09_778ff35f68f93be7.mp4", "t": "Do it twice and nothing happened. Mathematicians call that an involution. Like most committee meetings.", "s": "SwapTwice"}, {"v": "presentation_assets/s09_17fe18b07ffcfb2c.mp4", "t": "So bad pairs and swapped pairs that meet come in perfect couples.", "s": "SwapTwice"}, {"v": "presentation_assets/s10_00d3007a52511a86.mp4", "t": "One worry left: could a swapped pair avoid meeting, and have no partner?", "s": "DiagonalSweep"}, {"v": "presentation_assets/s10_f97d1ba19b7df56f.mp4", "t": "Sweep a diagonal across the grid. Every step moves an ant onto the next diagonal, so on each diagonal, each ant stands on exactly one dot.", "s": "DiagonalSweep"}, {"v": "presentation_assets/s10_1636b9b859535132.mp4", "t": "Track the gap between their columns. At the start, ant one is one column to the left.", "s": "DiagonalSweep"}, {"v": "presentation_assets/s10_9fae43add0f34ec0.mp4", "t": "At the end, it's one column to the right.", "s": "DiagonalSweep"}, {"v": "presentation_assets/s10_4ac9c88a86ddbda6.mp4", "t": "And from one diagonal to the next, the gap changes by at most one.", "s": "DiagonalSweep"}, {"v": "presentation_assets/s10_5d43a15b71de9be3.mp4", "t": "So somewhere it is zero: they share a dot. That's the intermediate value theorem, in its most humble form.", "s": "DiagonalSweep"}, {"v": "presentation_assets/s11_521d7382e8a528a8.mp4", "t": "So every bad pair has exactly one swapped partner, and every swapped pair has exactly one bad partner.", "s": "PutTogether"}, {"v": "presentation_assets/s11_da312c11550c5fe0.mp4", "t": "In the determinant they cancel. The minus sign isn't throwing things away at random. It removes an exact copy of the bad pairs.", "s": "PutTogether"}, {"v": "presentation_assets/s11_70c9d569c71668ab.mp4", "t": "What survives is exactly the twenty pairs that never meet.", "s": "PutTogether"}, {"v": "presentation_assets/s11_40b6e0ad9bbd1b6f.mp4", "t": "A bijective proof: the only kind a combinatorialist fully trusts.", "s": "PutTogether"}, {"v": "presentation_assets/s12_803b6720214008cc.mp4", "t": "You might be thinking: surely that's a fluke of this little grid. Move the second house around, and each time, brute force and the determinant agree.", "s": "MoveHomes"}, {"v": "presentation_assets/s12_cb2ef7b1bd109a8e.mp4", "t": "As long as the order stays the same: ant one's house up and to the left of ant two's.", "s": "MoveHomes"}, {"v": "presentation_assets/s12_0857dd145d907aaa.mp4", "t": "Swap the order and there are no peaceful routes at all. The determinant notices: it counts the swapped pairing instead, with a minus sign.", "s": "MoveHomes"}, {"v": "presentation_assets/s13_b41a1a5db64e4ea2.mp4", "t": "Add a third ant, with its own start and its own house.", "s": "SekiJoins"}, {"v": "presentation_assets/s13_57a8c3b55daa3892.mp4", "t": "A three-by-three table: fifty. Brute force over all the triples: fifty.", "s": "SekiJoins"}, {"v": "presentation_assets/s14_05213998c958d2ca.mp4", "t": "Here's the general statement, on our three ants. Take a one-way network with some starts and some ends, and count the paths from each start to each end. That's the matrix.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_5f76887d9f16b67c.mp4", "t": "Expand the determinant. Each term picks an end for every start, a pairing, with a plus or a minus sign, and counts every family of paths for that pairing.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_6cedb41092f1a898.mp4", "t": "Here: two hundred and sixteen, minus ninety-six, minus ninety-six, minus six, plus sixteen, plus sixteen.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_6eb98688261e5f7f.mp4", "t": "Of the two hundred and sixteen, only fifty never touch. And when the starts and ends are lined up in order, a crossed pairing always touches.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_8606df3e56416cc1.mp4", "t": "Now the tail swap from before pairs every touching family with one of opposite sign: one hundred ninety-eight against one hundred ninety-eight. Mathematicians call this a sign-reversing involution. They all cancel.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_85c57c1b11ab1d0d.mp4", "t": "What's left is exactly the fifty families that never touch. And that is true for any such network.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_bc8a88df9a9e0618.mp4", "t": "This is the Lindström–Gessel–Viennot lemma. Lindström found it in 1973; Gessel and Viennot rediscovered it in 1985 and showed how much it can do.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_846c1faf8be6c822.mp4", "t": "Physicists call walkers like ours vicious walkers. Given that our ants had a fight, that seems fair.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_9429f9a4e031f0b7.mp4", "t": "Brute force over n ants explodes. A determinant takes about n cubed steps, or n to the omega with fast matrix multiplication.", "s": "LemmaVisual"}, {"v": "presentation_assets/s14_25df56e12a18f59a.mp4", "t": "And omega keeps falling. Strassen broke three in 1969, and this month it reached nine quarters. Proved by an AI model at OpenAI, checked in Lean, and explained to the rest of us by Amir Shpilka. Division of labour, 2026.", "s": "LemmaVisual"}, {"v": "presentation_assets/s15_e1cbb9ab8b6dc473.mp4", "t": "So what can it count? The grid doesn't matter. Any network of one-way roads with no loops: right, up, diagonal, some roads missing.", "s": "WhatLGVCounts"}, {"v": "presentation_assets/s15_edbe2aeac925374d.mp4", "t": "Count the routes from every start to every end, and take the determinant.", "s": "WhatLGVCounts"}, {"v": "presentation_assets/s15_61fe2761b2fe77ff.mp4", "t": "You get the number of ways for everyone to travel without ever meeting. Here it's forty-two. Of course it is.", "s": "WhatLGVCounts"}, {"v": "presentation_assets/s15_f8dba0eb398a4356.mp4", "t": "So any puzzle that is secretly a family of non-touching paths, a determinant can count. And these puzzles are everywhere.", "s": "WhatLGVCounts"}, {"v": "presentation_assets/s16_7004a3ebda424b0a.mp4", "t": "Here's a hexagon with every side of length two, cut into little triangles.", "s": "HexTiling"}, {"v": "presentation_assets/s16_d5ec32d3038caed1.mp4", "t": "Glue two neighbouring triangles together and you get a tile: a lozenge. Lozenges come in three orientations.", "s": "HexTiling"}, {"v": "presentation_assets/s16_99c43dbb42ec15fb.mp4", "t": "A tiling covers the hexagon exactly with lozenges. Nothing sticking out, nothing overlapping.", "s": "HexTiling"}, {"v": "presentation_assets/s16_1ab88d523d3ef345.mp4", "t": "Here's one. Notice anything? It looks like a stack of boxes in the corner of a room.", "s": "HexTiling"}, {"v": "presentation_assets/s16_222fb6e1e816bb79.mp4", "t": "It's completely flat. Your brain is doing the 3D rendering for free.", "s": "HexTiling"}, {"v": "presentation_assets/s16_8d6d278dd29ee94f.mp4", "t": "So how many tilings are there?", "s": "HexTiling"}, {"v": "presentation_assets/s17_7679e55f16a8330f.mp4", "t": "Here's the trick. Fade out the flat tiles.", "s": "TilesToPaths"}, {"v": "presentation_assets/s17_650d740d52ba7b6b.mp4", "t": "Every other tile has two vertical edges. Enter through one, leave through the other, and keep going. Two edges on the left give two chains.", "s": "TilesToPaths"}, {"v": "presentation_assets/s17_84c1ab370f8e388c.mp4", "t": "Tiles never overlap, so the chains never touch. And going backwards, any two chains that don't touch fill in to exactly one tiling.", "s": "TilesToPaths"}, {"v": "presentation_assets/s17_040e54babb90a0a2.mp4", "t": "Now squash the hexagon onto our square grid. Each chain becomes a route of two steps right and two steps up, starting and ending exactly where our ants do.", "s": "TilesToPaths"}, {"v": "presentation_assets/s17_bdf27dfc8bc126d6.mp4", "t": "So the number of tilings is twenty. The same twenty. All this time, our ants were tiling a hexagon.", "s": "TilesToPaths"}, {"v": "presentation_assets/s18_f035359b67956caa.mp4", "t": "Seen in 3D, a tiling is a stack of boxes in a corner, each stack no taller than the ones behind it.", "s": "BoxesCorner"}, {"v": "presentation_assets/s18_030073498f50a478.mp4", "t": "A bigger box, three by three by three, gives a bigger hexagon and three chains: three ants that never meet.", "s": "BoxesCorner"}, {"v": "presentation_assets/s18_161aefb69f16a2fc.mp4", "t": "A three-by-three determinant counts them: nine hundred and eighty.", "s": "BoxesCorner"}, {"v": "presentation_assets/s18_178c8eb8bb606917.mp4", "t": "Percy MacMahon found a formula for every box, over a century ago. Combinatorialists call these plane partitions.", "s": "BoxesCorner"}, {"v": "presentation_assets/s19_2e3b7c1a7e11b227.mp4", "t": "Another disguise. A mountain range: each step goes up or down, and it never dips below sea level.", "s": "CatalanMountains"}, {"v": "presentation_assets/s19_c61fb85432667a86.mp4", "t": "How many ways can you draw two ranges, one inside the other, without touching?", "s": "CatalanMountains"}, {"v": "presentation_assets/s19_c3537f5ca7e7f67c.mp4", "t": "A single range is counted by the Catalan numbers. Put four of them in a two-by-two table: the determinant is three.", "s": "CatalanMountains"}, {"v": "presentation_assets/s19_95a439d8455c1e73.mp4", "t": "And here they are. Exactly three.", "s": "CatalanMountains"}, {"v": "presentation_assets/s20_18d194710003c7db.mp4", "t": "And one more, a beauty. This is an Aztec diamond: rows of two, four, six squares, and back down.", "s": "AztecIntro"}, {"v": "presentation_assets/s20_87c20287a052edc9.mp4", "t": "Tile it with dominoes. The smallest one has two tilings. The next has eight. The next, sixty-four.", "s": "AztecIntro"}, {"v": "presentation_assets/s20_7e2570b38f57e9bb.mp4", "t": "Guess the next one.", "s": "AztecIntro"}, {"v": "presentation_assets/s20_3c26b1d4748e7827.mp4", "t": "One thousand and twenty-four. Powers of two, every time. That's suspicious.", "s": "AztecIntro"}, {"v": "presentation_assets/s21_4606a6c66e575f2b.mp4", "t": "Colour the board like a chessboard, and there are four kinds of domino. Give each kind a job: a flat step, a step up, a step down, or nothing.", "s": "AztecPaths"}, {"v": "presentation_assets/s21_505868f8000b55e5.mp4", "t": "Now the dominoes link up into paths, from the left side to the right. Dominoes never overlap, so the paths never touch, and every such family comes from exactly one tiling.", "s": "AztecPaths"}, {"v": "presentation_assets/s21_6127b2942ec353da.mp4", "t": "So once again: count routes, take the determinant. Twelve times two minus four times four. Eight.", "s": "AztecPaths"}, {"v": "presentation_assets/s21_1911cec32b986b3c.mp4", "t": "One size up: sixty-four.", "s": "AztecPaths"}, {"v": "presentation_assets/s21_62b1147539f8c227.mp4", "t": "In general, order n gives two to the n times n plus one over two. A determinant, hiding in a pile of dominoes.", "s": "AztecPaths"}, {"v": "presentation_assets/s22_b8dafcf8596d10ac.mp4", "t": "Now pick one tiling at random, every tiling equally likely, on a big diamond, and let it grow.", "s": "ArcticCircle"}, {"v": "presentation_assets/s22_150ed271beac0eb5.mp4", "t": "This is order sixty.", "s": "ArcticCircle"}, {"v": "presentation_assets/s22_ff6dfb09e5421bc5.mp4", "t": "The corners freeze into brick walls. The middle is chaos. And the boundary between them is a perfect circle.", "s": "ArcticCircle"}, {"v": "presentation_assets/s22_06cbd1ca557f634f.mp4", "t": "That's the picture we started with. It's called the arctic circle theorem.", "s": "ArcticCircle"}, {"v": "presentation_assets/s23_2ca529ddc5a03f0c.mp4", "t": "Back to the chessboard from the start. Dominoes aren't paths, but there's a determinant trick here too. Shrink it to a two-by-three board: three tilings.", "s": "SmallBoard2"}, {"v": "presentation_assets/s23_f5cb74073a8c9f46.mp4", "t": "A domino joins a black square to a white neighbour. Write a one wherever they touch. Each tiling picks one entry in every row and every column: one term of the determinant.", "s": "SmallBoard2"}, {"v": "presentation_assets/s23_defc978974d9c3f8.mp4", "t": "If determinants count pairings, this should give three. It gives minus one.", "s": "SmallBoard2"}, {"v": "presentation_assets/s23_aba4e618f8a68263.mp4", "t": "The terms come with signs: plus for this one, minus for these two. Here the cancellation eats the good ones.", "s": "SmallBoard2"}, {"v": "presentation_assets/s24_7fe10fee0a53038f.mp4", "t": "In 1961 the physicist Pieter Kasteleyn had an idea: if the signs don't cancel the way you want, change the signs.", "s": "SignFix2"}, {"v": "presentation_assets/s24_8ff6ff463fb82649.mp4", "t": "Put a minus sign on this one edge. Only the all-vertical tiling uses it, so only its sign flips.", "s": "SignFix2"}, {"v": "presentation_assets/s24_7003627a879d7ad2.mp4", "t": "Now every tiling carries the same sign. The determinant is minus three. Ignore the sign: three.", "s": "SignFix2"}, {"v": "presentation_assets/s25_efef88db7c5d973c.mp4", "t": "On a four-by-four board, the plain determinant says there are zero tilings. Very confident, very wrong.", "s": "Board4x4"}, {"v": "presentation_assets/s25_485d43275f5fd92f.mp4", "t": "Put minus signs on the vertical edges of every other column, and the determinant gives thirty-six. Exactly right.", "s": "Board4x4"}, {"v": "presentation_assets/s26_29a3f4b425d1ddf1.mp4", "t": "Now the full chessboard: twelve million, nine hundred eighty-eight thousand, eight hundred sixteen. The five-month count, in an instant.", "s": "FKT"}, {"v": "presentation_assets/s26_0308da52f199f97d.mp4", "t": "The rule behind it: every little loop of four edges carries an odd number of minus signs.", "s": "FKT"}, {"v": "presentation_assets/s26_6b984f637ca1ee95.mp4", "t": "And it's not really about chessboards. Squares are vertices, dominoes are edges, and a tiling is a perfect matching.", "s": "FKT"}, {"v": "presentation_assets/s26_bfe20dcff35337e8.mp4", "t": "Kasteleyn, Temperley and Fisher made this work for any graph you can draw without crossings: the FKT algorithm counts perfect matchings of planar graphs in polynomial time.", "s": "FKT"}, {"v": "presentation_assets/s26_61c04b286fdfc9c7.mp4", "t": "When a physicist needs to count twelve million tilings, they don't count. They take a determinant, and then let the board go to infinity.", "s": "FKT"}, {"v": "presentation_assets/s27_e25ba6b68a1d9b97.mp4", "t": "Let's step back. Ants that never meet. Tilings of a hexagon. Boxes in a corner. Mountain ranges. Aztec diamonds. Chessboards.", "s": "Map"}, {"v": "presentation_assets/s27_e2eaf0d60a3af4ce.mp4", "t": "All counted by one determinant each.", "s": "Map"}, {"v": "presentation_assets/s28_e964ae5f0e33ef93.mp4", "t": "And it's the same trick every time. Count everything, good and bad, each with a sign.", "s": "Finale"}, {"v": "presentation_assets/s28_41bb6d96875bd03a.mp4", "t": "The bad ones pair up with opposite signs, and cancel. What's left is exactly what you wanted.", "s": "Finale"}, {"v": "presentation_assets/s28_c487042da6e4ee0d.mp4", "t": "For a computer scientist, that's remarkable. Counting is usually hopeless: counting perfect matchings of a general graph is sharp-P complete. That's Valiant, in 1979.", "s": "Finale"}, {"v": "presentation_assets/s28_e162be521135e8d2.mp4", "t": "But if your puzzle turns into non-touching paths, or a matching on a planar graph, it becomes one determinant, and polynomial time.", "s": "Finale"}, {"v": "presentation_assets/s28_e9f726aa11f00cdc.mp4", "t": "Determinants can count, because minus signs can cancel.", "s": "Finale"}, {"v": "presentation_assets/s29_777abe21953ce27f.mp4", "t": "As for our ants: they can finally go home in peace. Twenty ways home, and they never had to meet.", "s": "Goodbye"}, {"v": "presentation_assets/s29_ced1ff988af7cedd.mp4", "t": "Thanks for watching.", "s": "Goodbye"}, {"v": "presentation_assets/s30_58cdb1db8d1e802b.mp4", "t": "", "s": "Credits"}];let i=0,showNext=false;const v=document.getElementById('v'),pre=document.createElement('video');pre.muted=true;pre.preload='auto';
function show(k){i=Math.max(0,Math.min(S.length-1,k));const s=S[i];v.src=s.v;v.play().catch(()=>{});
 const t=document.getElementById('text');t.textContent=s.t||'(no narration: let the animation play)';t.className=s.t?'':'empty';
 document.getElementById('scene').innerHTML='<b>'+s.s+'</b>';document.getElementById('pos').textContent='slide '+(i+1)+' / '+S.length;
 document.querySelector('#bar div').style.width=((i+1)/S.length*100)+'%';
 const n=S[i+1];document.getElementById('next').textContent=showNext&&n?('next: '+(n.t||'(pause)')):'';
 if(n){pre.src=n.v}try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
// background music: one continuous, gapless loop (Web Audio), independent of slides
let AC=null,GAIN=null,BUF=null,SRC=null,musicOn=false;
try{musicOn=localStorage.getItem('detMusic')==='1'}catch(e){}
async function startMusic(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();GAIN=AC.createGain();GAIN.gain.value=0;GAIN.connect(AC.destination)}
  if(!BUF){const r=await fetch('music.mp3');BUF=await AC.decodeAudioData(await r.arrayBuffer())}}catch(e){console.warn('music unavailable',e);return}
 if(AC.state==='suspended')await AC.resume();
 if(!SRC){SRC=AC.createBufferSource();SRC.buffer=BUF;SRC.loop=true;SRC.loopStart=0.05;SRC.loopEnd=BUF.duration-0.05;SRC.connect(GAIN);SRC.start(0,0.05)}
 GAIN.gain.setTargetAtTime(vol(),AC.currentTime,0.4)}
function stopMusic(){if(GAIN)GAIN.gain.setTargetAtTime(0,AC.currentTime,0.3)}
function vol(){return document.getElementById('vol').value/100*0.6}
function paintMusic(){document.getElementById('mb').textContent=musicOn?'♪ music: on':'♪ music: off'}
function toggleMusic(){musicOn=!musicOn;try{localStorage.setItem('detMusic',musicOn?'1':'0')}catch(e){}paintMusic();musicOn?startMusic():stopMusic()}
document.getElementById('vol').oninput=()=>{if(musicOn&&GAIN)GAIN.gain.setTargetAtTime(vol(),AC.currentTime,0.1)};
// browsers only allow sound after a user gesture: resume on the first click/key if music was left on
const kick=()=>{if(musicOn)startMusic();document.removeEventListener('click',kick);document.removeEventListener('keydown',kick)};
document.addEventListener('click',kick);document.addEventListener('keydown',kick);paintMusic();
function go(d){show(i+d)}function replay(){v.currentTime=0;v.play()}
function toggleNext(){showNext=!showNext;document.getElementById('nb').textContent=showNext?'hide next line':'show next line';show(i)}
function fs(){const a=document.getElementById('app');document.fullscreenElement?document.exitFullscreen():a.requestFullscreen&&a.requestFullscreen()}
document.getElementById('stage').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(e.clientX<r.left+r.width*0.3?-1:1)};
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(1)}
 else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(-1)}else if(e.key=='r'||e.key=='R')replay();
 else if(e.key=='n'||e.key=='N')toggleNext();else if(e.key=='f'||e.key=='F')fs();else if(e.key=='m'||e.key=='M')toggleMusic();else if(e.key=='Home')show(0);else if(e.key=='End')show(S.length-1)});
show((parseInt(location.hash.slice(1))||1)-1);
