<script>
const S=[{"t": "Most of us met the determinant as a formula: a d minus b c.", "s": "Opening", "v": "clips/001.mp4?v=1793974496"}, {"t": "It tells us whether a system of linear equations has a unique solution.", "s": "Opening", "v": "clips/002.mp4?v=1793974496"}, {"t": "It measures how much a linear transformation scales area. Here, every area doubles.", "s": "Opening", "v": "clips/003.mp4?v=1793974496"}, {"t": "And when it's zero, everything gets squashed flat.", "s": "Opening", "v": "clips/004.mp4?v=1793974496"}, {"t": "It even finds the area of any polygon.", "s": "Opening", "v": "clips/005.mp4?v=1793974496"}, {"t": "One of the most beautiful and unexpected places I've found determinants is combinatorics.", "s": "Opening", "v": "clips/006.mp4?v=1793974496"}, {"t": "And today, I want to show you how determinants can count.", "s": "Opening", "v": "clips/007.mp4?v=1793974496"}, {"t": "Let's start with a simple puzzle.", "s": "Opening", "v": "clips/008.mp4?v=1793974496"}, {"t": "Meet these two ants.", "s": "Hook", "v": "clips/009.mp4?v=1793974496"}, {"t": "They both live in a grid-like world.", "s": "Hook", "v": "clips/010.mp4?v=1793974496"}, {"t": "And they both want to get back home, right now.", "s": "Hook", "v": "clips/011.mp4?v=1793974496"}, {"t": "On this grid there are rules. An ant can only step up, or to the right. Never down, and never left.", "s": "Hook", "v": "clips/012.mp4?v=1793974496"}, {"t": "Of course, there are many paths home. The blue ant could go this way, or this way. And the orange ant, this way, or that way.", "s": "Hook", "v": "clips/013.mp4?v=1793974496"}, {"t": "But today, they can't just take any path. They had a fight, and if they meet, they'll start fighting again.", "s": "Hook", "v": "clips/014.mp4?v=1793974496"}, {"t": "So neither will set foot on any dot the other one walks on. Not even later: ants leave a scent trail.", "s": "Hook", "v": "clips/015.mp4?v=1793974496"}, {"t": "So, how many pairs of paths get them home without intersecting?", "s": "Hook", "v": "clips/016.mp4?v=1793974496"}, {"t": "You can always find one easily. Here, the blue one goes up and around, and the orange one goes right and around. They never meet.", "s": "Hook", "v": "clips/017.mp4?v=1793974496"}, {"t": "And here's one where they cross.", "s": "Hook", "v": "clips/018.mp4?v=1793974496"}, {"t": "Let's check them all, one by one. This pair works. This one doesn't. Neither does this one. Or this one. And so on.", "s": "Hook", "v": "clips/019.mp4?v=1793974496"}, {"t": "Twenty pairs never meet, and sixteen do.", "s": "Hook", "v": "clips/020.mp4?v=1793974496"}, {"t": "I know what you're thinking: this is stupid. There must be an easier way. Well, here comes an old friend.", "s": "TableAndDet", "v": "clips/021.mp4?v=1793974496"}, {"t": "Consider this two-by-two matrix, A. Its rows are the ants, and its columns are the houses.", "s": "TableAndDet", "v": "clips/022.mp4?v=1793974496"}, {"t": "The first entry counts the paths from the blue ant to its own home. There are six.", "s": "TableAndDet", "v": "clips/023.mp4?v=1793974496"}, {"t": "The second entry is a little sneakier: the paths from the blue ant to the orange ant's house. There are four.", "s": "TableAndDet", "v": "clips/024.mp4?v=1793974496"}, {"t": "And by symmetry, the orange ant gives the same numbers the other way round: four, and six.", "s": "TableAndDet", "v": "clips/025.mp4?v=1793974496"}, {"t": "Now find the determinant of A: six times six, minus four times four,", "s": "TableAndDet", "v": "clips/026.mp4?v=1793974496"}, {"t": "which is twenty. Voilà!", "s": "TableAndDet", "v": "clips/027.mp4?v=1793974496"}, {"t": "The same number as before.", "s": "TableAndDet", "v": "clips/028.mp4?v=1793974496"}, {"t": "In fact, there's nothing special about this scenario.", "s": "ThreeAnts", "v": "clips/029.mp4?v=1793974496"}, {"t": "Make the grid bigger, and bring in a third ant, with a house of its own.", "s": "ThreeAnts", "v": "clips/030.mp4?v=1793974496"}, {"t": "Build the same kind of matrix: three ants, three houses, and each entry counts the paths from one ant to one house.", "s": "ThreeAnts", "v": "clips/031.mp4?v=1793974496"}, {"t": "Its determinant is fifty.", "s": "ThreeAnts", "v": "clips/032.mp4?v=1793974496"}, {"t": "And fifty is exactly the number of ways all three ants can get home without any of their paths intersecting.", "s": "ThreeAnts", "v": "clips/033.mp4?v=1793974496"}, {"t": "So, why does this work?", "s": "WhyCard", "v": "clips/034.mp4?v=1793974496"}, {"t": "Let's get back to our two ants, and work it out.", "s": "WhyCard", "v": "clips/035.mp4?v=1793974496"}, {"t": "Take a pair where the ants swap houses.", "s": "SwappedToMeet", "v": "clips/036.mp4?v=1793974496"}, {"t": "The blue ant starts to the left of the orange one, and ends to its right.", "s": "SwappedToMeet", "v": "clips/037.mp4?v=1793974496"}, {"t": "So somewhere, they must share a dot.", "s": "SwappedToMeet", "v": "clips/038.mp4?v=1793974496"}, {"t": "Take the first shared dot, and swap the tails from there.", "s": "SwappedToMeet", "v": "clips/039.mp4?v=1793974496"}, {"t": "Now each ant is at its own home, and their paths meet.", "s": "SwappedToMeet", "v": "clips/040.mp4?v=1793974496"}, {"t": "Now the other way: a pair that meets on the way home.", "s": "MeetToSwapped", "v": "clips/041.mp4?v=1793974496"}, {"t": "Swap the tails at the first shared dot, and they end up in each other's houses.", "s": "MeetToSwapped", "v": "clips/042.mp4?v=1793974496"}, {"t": "Swap again at the same dot, and we're back where we started.", "s": "MeetToSwapped", "v": "clips/043.mp4?v=1793974496"}, {"t": "So swapped pairs and meeting pairs match up, one to one.", "s": "Bijection", "v": "clips/044.mp4?v=1793974496"}, {"t": "This meeting pair goes with this swapped pair.", "s": "Bijection", "v": "clips/045.mp4?v=1793974496"}, {"t": "This one, with this one.", "s": "Bijection", "v": "clips/046.mp4?v=1793974496"}, {"t": "And this one, with this one.", "s": "Bijection", "v": "clips/047.mp4?v=1793974496"}, {"t": "And so on.", "s": "Bijection", "v": "clips/048.mp4?v=1793974496"}, {"t": "Sixteen of each.", "s": "Bijection", "v": "clips/049.mp4?v=1793974496"}, {"t": "Now, the formula.", "s": "Formula", "v": "clips/050.mp4?v=1793974496"}, {"t": "Six times six counts every pair going home: twenty that never meet, and sixteen that meet.", "s": "Formula", "v": "clips/051.mp4?v=1793974496"}, {"t": "Four times four counts the sixteen swapped pairs.", "s": "Formula", "v": "clips/052.mp4?v=1793974496"}, {"t": "They cancel the meeting pairs exactly.", "s": "Formula", "v": "clips/053.mp4?v=1793974496"}, {"t": "Leaving twenty.", "s": "Formula", "v": "clips/054.mp4?v=1793974496"}, {"t": "A bijective proof: the only kind a combinatorialist fully trusts.", "s": "Formula", "v": "clips/055.mp4?v=1793974496"}, {"t": "You might be thinking: surely that's a fluke of this little grid. Move the second house around, and each time, brute force and the determinant agree.", "s": "MoveHomes", "v": "clips/056.mp4?v=1793974496"}, {"t": "As long as the order stays the same: ant one's house up and to the left of ant two's.", "s": "MoveHomes", "v": "clips/057.mp4?v=1793974496"}, {"t": "Swap the order and there are no peaceful routes at all. The determinant notices: it counts the swapped pairing instead, with a minus sign.", "s": "MoveHomes", "v": "clips/058.mp4?v=1793974496"}, {"t": "Here's the general statement, on our three ants. Take a one-way network with some starts and some ends, and count the paths from each start to each end. That's the matrix.", "s": "LemmaVisual", "v": "clips/059.mp4?v=1793974496"}, {"t": "Expand the determinant. Each term picks an end for every start, a pairing, with a plus or a minus sign, and counts every family of paths for that pairing.", "s": "LemmaVisual", "v": "clips/060.mp4?v=1793974496"}, {"t": "Here: two hundred and sixteen, minus ninety-six, minus ninety-six, minus six, plus sixteen, plus sixteen.", "s": "LemmaVisual", "v": "clips/061.mp4?v=1793974496"}, {"t": "Of the two hundred and sixteen, only fifty never touch. And when the starts and ends are lined up in order, a crossed pairing always touches.", "s": "LemmaVisual", "v": "clips/062.mp4?v=1793974496"}, {"t": "Now the tail swap from before pairs every touching family with one of opposite sign: one hundred ninety-eight against one hundred ninety-eight. Mathematicians call this a sign-reversing involution. They all cancel.", "s": "LemmaVisual", "v": "clips/063.mp4?v=1793974496"}, {"t": "What's left is exactly the fifty families that never touch. And that is true for any such network.", "s": "LemmaVisual", "v": "clips/064.mp4?v=1793974496"}, {"t": "This is the Lindström–Gessel–Viennot lemma. Lindström found it in 1973; Gessel and Viennot rediscovered it in 1985 and showed how much it can do.", "s": "LemmaVisual", "v": "clips/065.mp4?v=1793974496"}, {"t": "Physicists call walkers like ours vicious walkers. Given that our ants had a fight, that seems fair.", "s": "LemmaVisual", "v": "clips/066.mp4?v=1793974496"}, {"t": "Brute force over n ants explodes. A determinant takes about n cubed steps, or n to the omega with fast matrix multiplication.", "s": "LemmaVisual", "v": "clips/067.mp4?v=1793974496"}, {"t": "And omega keeps falling. Strassen broke three in 1969, and last month it reached nine quarters. Proved by an AI model at OpenAI, checked in Lean, and explained to the rest of us by Amir Shpilka. Division of labour, 2026.", "s": "LemmaVisual", "v": "clips/068.mp4?v=1793974496"}, {"t": "So what can it count? The grid doesn't matter. Any network of one-way roads with no loops: right, up, diagonal, some roads missing.", "s": "WhatLGVCounts", "v": "clips/069.mp4?v=1793974496"}, {"t": "Count the routes from every start to every end, and take the determinant.", "s": "WhatLGVCounts", "v": "clips/070.mp4?v=1793974496"}, {"t": "You get the number of ways for everyone to travel without ever meeting. Here it's forty-two. Of course it is.", "s": "WhatLGVCounts", "v": "clips/071.mp4?v=1793974496"}, {"t": "So any puzzle that is secretly a family of non-touching paths, a determinant can count. And these puzzles are everywhere.", "s": "WhatLGVCounts", "v": "clips/072.mp4?v=1793974496"}, {"t": "Here's a hexagon with every side of length two, cut into little triangles.", "s": "HexTiling", "v": "clips/073.mp4?v=1793974496"}, {"t": "Glue two neighbouring triangles together and you get a tile: a lozenge. Lozenges come in three orientations.", "s": "HexTiling", "v": "clips/074.mp4?v=1793974496"}, {"t": "A tiling covers the hexagon exactly with lozenges. Nothing sticking out, nothing overlapping.", "s": "HexTiling", "v": "clips/075.mp4?v=1793974496"}, {"t": "Here's one. Notice anything? It looks like a stack of boxes in the corner of a room.", "s": "HexTiling", "v": "clips/076.mp4?v=1793974496"}, {"t": "It's completely flat. Your brain is doing the 3D rendering for free.", "s": "HexTiling", "v": "clips/077.mp4?v=1793974496"}, {"t": "So how many tilings are there?", "s": "HexTiling", "v": "clips/078.mp4?v=1793974496"}, {"t": "Here's the trick. Fade out the flat tiles.", "s": "TilesToPaths", "v": "clips/079.mp4?v=1793974496"}, {"t": "Every other tile has two vertical edges. Enter through one, leave through the other, and keep going. Two edges on the left give two chains.", "s": "TilesToPaths", "v": "clips/080.mp4?v=1793974496"}, {"t": "Tiles never overlap, so the chains never touch. And going backwards, any two chains that don't touch fill in to exactly one tiling.", "s": "TilesToPaths", "v": "clips/081.mp4?v=1793974496"}, {"t": "Now squash the hexagon onto our square grid. Each chain becomes a route of two steps right and two steps up, starting and ending exactly where our ants do.", "s": "TilesToPaths", "v": "clips/082.mp4?v=1793974496"}, {"t": "So the number of tilings is twenty. The same twenty. All this time, our ants were tiling a hexagon.", "s": "TilesToPaths", "v": "clips/083.mp4?v=1793974496"}, {"t": "Seen in 3D, a tiling is a stack of boxes in a corner, each stack no taller than the ones behind it.", "s": "BoxesCorner", "v": "clips/084.mp4?v=1793974496"}, {"t": "A bigger box, three by three by three, gives a bigger hexagon and three chains: three ants that never meet.", "s": "BoxesCorner", "v": "clips/085.mp4?v=1793974496"}, {"t": "A three-by-three determinant counts them: nine hundred and eighty.", "s": "BoxesCorner", "v": "clips/086.mp4?v=1793974496"}, {"t": "Percy MacMahon found a formula for every box, over a century ago. Combinatorialists call these plane partitions.", "s": "BoxesCorner", "v": "clips/087.mp4?v=1793974496"}, {"t": "Another disguise. A mountain range: each step goes up or down, and it never dips below sea level.", "s": "CatalanMountains", "v": "clips/088.mp4?v=1793974496"}, {"t": "How many ways can you draw two ranges, one inside the other, without touching?", "s": "CatalanMountains", "v": "clips/089.mp4?v=1793974496"}, {"t": "A single range is counted by the Catalan numbers. Put four of them in a two-by-two table: the determinant is three.", "s": "CatalanMountains", "v": "clips/090.mp4?v=1793974496"}, {"t": "And here they are. Exactly three.", "s": "CatalanMountains", "v": "clips/091.mp4?v=1793974496"}, {"t": "And one more, a beauty. This is an Aztec diamond: rows of two, four, six squares, and back down.", "s": "AztecIntro", "v": "clips/092.mp4?v=1793974496"}, {"t": "Tile it with dominoes. The smallest one has two tilings. The next has eight. The next, sixty-four.", "s": "AztecIntro", "v": "clips/093.mp4?v=1793974496"}, {"t": "Guess the next one.", "s": "AztecIntro", "v": "clips/094.mp4?v=1793974496"}, {"t": "One thousand and twenty-four. Powers of two, every time. That's suspicious.", "s": "AztecIntro", "v": "clips/095.mp4?v=1793974496"}, {"t": "Colour the board like a chessboard, and there are four kinds of domino. Give each kind a job: a flat step, a step up, a step down, or nothing.", "s": "AztecPaths", "v": "clips/096.mp4?v=1793974496"}, {"t": "Now the dominoes link up into paths, from the left side to the right. Dominoes never overlap, so the paths never touch, and every such family comes from exactly one tiling.", "s": "AztecPaths", "v": "clips/097.mp4?v=1793974496"}, {"t": "So once again: count routes, take the determinant. Twelve times two minus four times four. Eight.", "s": "AztecPaths", "v": "clips/098.mp4?v=1793974496"}, {"t": "One size up: sixty-four.", "s": "AztecPaths", "v": "clips/099.mp4?v=1793974496"}, {"t": "In general, order n gives two to the n times n plus one over two. A determinant, hiding in a pile of dominoes.", "s": "AztecPaths", "v": "clips/100.mp4?v=1793974496"}, {"t": "Now pick one tiling at random, every tiling equally likely, on a big diamond, and let it grow.", "s": "ArcticCircle", "v": "clips/101.mp4?v=1793974496"}, {"t": "This is order sixty.", "s": "ArcticCircle", "v": "clips/102.mp4?v=1793974496"}, {"t": "The corners freeze into brick walls. The middle is chaos. And as the diamond grows, the boundary between them becomes a perfect circle.", "s": "ArcticCircle", "v": "clips/103.mp4?v=1793974496"}, {"t": "It's called the arctic circle theorem.", "s": "ArcticCircle", "v": "clips/104.mp4?v=1793974496"}, {"t": "Back to the chessboard from the start. Dominoes aren't paths, but there's a determinant trick here too. Shrink it to a two-by-three board: three tilings.", "s": "SmallBoard2", "v": "clips/105.mp4?v=1793974496"}, {"t": "A domino joins a black square to a white neighbour. Write a one wherever they touch. Each tiling picks one entry in every row and every column: one term of the determinant.", "s": "SmallBoard2", "v": "clips/106.mp4?v=1793974496"}, {"t": "If determinants count pairings, this should give three. It gives minus one.", "s": "SmallBoard2", "v": "clips/107.mp4?v=1793974496"}, {"t": "The terms come with signs: plus for this one, minus for these two. Here the cancellation eats the good ones.", "s": "SmallBoard2", "v": "clips/108.mp4?v=1793974496"}, {"t": "In 1961 the physicist Pieter Kasteleyn had an idea: if the signs don't cancel the way you want, change the signs.", "s": "SignFix2", "v": "clips/109.mp4?v=1793974496"}, {"t": "Put a minus sign on this one edge. Only the all-vertical tiling uses it, so only its sign flips.", "s": "SignFix2", "v": "clips/110.mp4?v=1793974496"}, {"t": "Now every tiling carries the same sign. The determinant is minus three. Ignore the sign: three.", "s": "SignFix2", "v": "clips/111.mp4?v=1793974496"}, {"t": "On a four-by-four board, the plain determinant says there are zero tilings. Very confident, very wrong.", "s": "Board4x4", "v": "clips/112.mp4?v=1793974496"}, {"t": "Put minus signs on the vertical edges of every other column, and the determinant gives thirty-six. Exactly right.", "s": "Board4x4", "v": "clips/113.mp4?v=1793974496"}, {"t": "Now the full chessboard: twelve million, nine hundred eighty-eight thousand, eight hundred sixteen. The five-month count, in an instant.", "s": "FKT", "v": "clips/114.mp4?v=1793974496"}, {"t": "The rule behind it: every little loop of four edges carries an odd number of minus signs.", "s": "FKT", "v": "clips/115.mp4?v=1793974496"}, {"t": "And it's not really about chessboards. Squares are vertices, dominoes are edges, and a tiling is a perfect matching.", "s": "FKT", "v": "clips/116.mp4?v=1793974496"}, {"t": "Kasteleyn, Temperley and Fisher made this work for any graph you can draw without crossings: the FKT algorithm counts perfect matchings of planar graphs in polynomial time.", "s": "FKT", "v": "clips/117.mp4?v=1793974496"}, {"t": "When a physicist needs to count twelve million tilings, they don't count. They take a determinant, and then let the board go to infinity.", "s": "FKT", "v": "clips/118.mp4?v=1793974496"}, {"t": "Let's step back. Ants that never meet. Tilings of a hexagon. Boxes in a corner. Mountain ranges. Aztec diamonds. Chessboards.", "s": "Map", "v": "clips/119.mp4?v=1793974496"}, {"t": "All counted by one determinant each.", "s": "Map", "v": "clips/120.mp4?v=1793974496"}, {"t": "And it's the same trick every time. Count everything, good and bad, each with a sign.", "s": "Finale", "v": "clips/121.mp4?v=1793974496"}, {"t": "The bad ones pair up with opposite signs, and cancel. What's left is exactly what you wanted.", "s": "Finale", "v": "clips/122.mp4?v=1793974496"}, {"t": "For a computer scientist, that's remarkable. Counting is usually hopeless: counting perfect matchings of a general graph is sharp-P complete. That's Valiant, in 1979.", "s": "Finale", "v": "clips/123.mp4?v=1793974496"}, {"t": "But if your puzzle turns into non-touching paths, or a matching on a planar graph, it becomes one determinant, and polynomial time.", "s": "Finale", "v": "clips/124.mp4?v=1793974496"}, {"t": "Determinants can count, because minus signs can cancel.", "s": "Finale", "v": "clips/125.mp4?v=1793974496"}, {"t": "As for our ants: they can finally go home in peace. Twenty ways home, and they never had to meet.", "s": "Goodbye", "v": "clips/126.mp4?v=1793974496"}, {"t": "Thanks for watching.", "s": "Goodbye", "v": "clips/127.mp4?v=1793974496"}, {"t": "", "s": "Credits", "v": "clips/128.mp4?v=1793974496"}];let i=0,showNext=false;const v=document.getElementById('v'),pre=document.createElement('video');pre.muted=true;pre.preload='auto';let started=false,muted=false;
