<script>
const S=[{"t": "Most of us met the determinant as a formula: a d minus b c.", "s": "Opening", "v": "clips/001.mp4?v=1793984894"}, {"t": "It tells us whether a system of linear equations has a unique solution.", "s": "Opening", "v": "clips/002.mp4?v=1793984894"}, {"t": "It measures how much a linear transformation scales area. Here, every area doubles.", "s": "Opening", "v": "clips/003.mp4?v=1793984894"}, {"t": "And when it's zero, everything gets squashed flat.", "s": "Opening", "v": "clips/004.mp4?v=1793984894"}, {"t": "It even finds the area of any polygon.", "s": "Opening", "v": "clips/005.mp4?v=1793984894"}, {"t": "One of the most beautiful and unexpected places I've found determinants is combinatorics.", "s": "Opening", "v": "clips/006.mp4?v=1793984894"}, {"t": "And today, I want to show you how determinants can count.", "s": "Opening", "v": "clips/007.mp4?v=1793984894"}, {"t": "Let's start with a simple puzzle.", "s": "Opening", "v": "clips/008.mp4?v=1793984894"}, {"t": "Meet these two ants.", "s": "Hook", "v": "clips/009.mp4?v=1793984894"}, {"t": "They both live in a grid-like world.", "s": "Hook", "v": "clips/010.mp4?v=1793984894"}, {"t": "And they both want to get back home, right now.", "s": "Hook", "v": "clips/011.mp4?v=1793984894"}, {"t": "On this grid there are rules. An ant can only step up, or to the right. Never down, and never left.", "s": "Hook", "v": "clips/012.mp4?v=1793984894"}, {"t": "Of course, there are many paths home. The blue ant could go this way, or this way. And the orange ant, this way, or that way.", "s": "Hook", "v": "clips/013.mp4?v=1793984894"}, {"t": "But today, they can't just take any path. They had a fight, and if they meet, they'll start fighting again.", "s": "Hook", "v": "clips/014.mp4?v=1793984894"}, {"t": "So neither will set foot on any dot the other one walks on. Not even later: ants leave a scent trail.", "s": "Hook", "v": "clips/015.mp4?v=1793984894"}, {"t": "So, how many pairs of paths get them home without intersecting?", "s": "Hook", "v": "clips/016.mp4?v=1793984894"}, {"t": "You can always find one easily. Here, the blue one goes up and around, and the orange one goes right and around. They never meet.", "s": "Hook", "v": "clips/017.mp4?v=1793984894"}, {"t": "And here's one where they cross.", "s": "Hook", "v": "clips/018.mp4?v=1793984894"}, {"t": "Let's check them all, one by one. This pair works. This one doesn't. Neither does this one. Or this one. And so on.", "s": "Hook", "v": "clips/019.mp4?v=1793984894"}, {"t": "Twenty pairs never meet, and sixteen do.", "s": "Hook", "v": "clips/020.mp4?v=1793984894"}, {"t": "I know what you're thinking: this is stupid. There must be an easier way. Well, here comes an old friend.", "s": "TableAndDet", "v": "clips/021.mp4?v=1793984894"}, {"t": "Consider this two-by-two matrix, A. Its rows are the ants, and its columns are the houses.", "s": "TableAndDet", "v": "clips/022.mp4?v=1793984894"}, {"t": "The first entry counts the paths from the blue ant to its own home. There are six.", "s": "TableAndDet", "v": "clips/023.mp4?v=1793984894"}, {"t": "The second entry is a little sneakier: the paths from the blue ant to the orange ant's house. There are four.", "s": "TableAndDet", "v": "clips/024.mp4?v=1793984894"}, {"t": "And by symmetry, the orange ant gives the same numbers the other way round: four, and six.", "s": "TableAndDet", "v": "clips/025.mp4?v=1793984894"}, {"t": "Now find the determinant of A: six times six, minus four times four,", "s": "TableAndDet", "v": "clips/026.mp4?v=1793984894"}, {"t": "which is twenty. Voilà!", "s": "TableAndDet", "v": "clips/027.mp4?v=1793984894"}, {"t": "The same number as before.", "s": "TableAndDet", "v": "clips/028.mp4?v=1793984894"}, {"t": "In fact, there's nothing special about this scenario.", "s": "ThreeAnts", "v": "clips/029.mp4?v=1793984894"}, {"t": "Make the grid bigger, and bring in a third ant, with a house of its own.", "s": "ThreeAnts", "v": "clips/030.mp4?v=1793984894"}, {"t": "Build the same kind of matrix: three ants, three houses, and each entry counts the paths from one ant to one house.", "s": "ThreeAnts", "v": "clips/031.mp4?v=1793984894"}, {"t": "Its determinant is fifty.", "s": "ThreeAnts", "v": "clips/032.mp4?v=1793984894"}, {"t": "And fifty is exactly the number of ways all three ants can get home without any of their paths intersecting.", "s": "ThreeAnts", "v": "clips/033.mp4?v=1793984894"}, {"t": "So, why does this work?", "s": "WhyCard", "v": "clips/034.mp4?v=1793984894"}, {"t": "Let's get back to our two ants, and work it out.", "s": "WhyCard", "v": "clips/035.mp4?v=1793984894"}, {"t": "Here's the thing that bugged me. Six times six counts all thirty-six pairs going home.", "s": "AllPairs", "v": "clips/036.mp4?v=1793984894"}, {"t": "Twenty never meet. Sixteen do.", "s": "AllPairs", "v": "clips/037.mp4?v=1793984894"}, {"t": "Four times four counts the pairs where the ants swap houses: also sixteen.", "s": "AllPairs", "v": "clips/038.mp4?v=1793984894"}, {"t": "So for the determinant to give twenty, the minus sign must cancel the sixteen meeting pairs against the sixteen swapped ones.", "s": "AllPairs", "v": "clips/039.mp4?v=1793984894"}, {"t": "So they must match up, one to one. Let's see how.", "s": "AllPairs", "v": "clips/040.mp4?v=1793984894"}, {"t": "Take a pair where the ants swap houses.", "s": "SwappedToMeet", "v": "clips/041.mp4?v=1793984894"}, {"t": "The blue ant starts to the left of the orange one, and ends to its right.", "s": "SwappedToMeet", "v": "clips/042.mp4?v=1793984894"}, {"t": "So somewhere, they must share a dot.", "s": "SwappedToMeet", "v": "clips/043.mp4?v=1793984894"}, {"t": "Take the first shared dot, and swap the tails from there.", "s": "SwappedToMeet", "v": "clips/044.mp4?v=1793984894"}, {"t": "Now each ant is at its own home, and their paths meet.", "s": "SwappedToMeet", "v": "clips/045.mp4?v=1793984894"}, {"t": "Now the other way: a pair that meets on the way home.", "s": "MeetToSwapped", "v": "clips/046.mp4?v=1793984894"}, {"t": "Swap the tails at the first shared dot, and they end up in each other's houses.", "s": "MeetToSwapped", "v": "clips/047.mp4?v=1793984894"}, {"t": "Swap again at the same dot, and we're back where we started.", "s": "MeetToSwapped", "v": "clips/048.mp4?v=1793984894"}, {"t": "So swapped pairs and meeting pairs match up, one to one.", "s": "Bijection", "v": "clips/049.mp4?v=1793984894"}, {"t": "This meeting pair goes with this swapped pair.", "s": "Bijection", "v": "clips/050.mp4?v=1793984894"}, {"t": "This one, with this one.", "s": "Bijection", "v": "clips/051.mp4?v=1793984894"}, {"t": "And this one, with this one.", "s": "Bijection", "v": "clips/052.mp4?v=1793984894"}, {"t": "And so on.", "s": "Bijection", "v": "clips/053.mp4?v=1793984894"}, {"t": "Sixteen of each.", "s": "Bijection", "v": "clips/054.mp4?v=1793984894"}, {"t": "Now, the formula.", "s": "Formula", "v": "clips/055.mp4?v=1793984894"}, {"t": "Six times six counts every pair going home: twenty that never meet, and sixteen that meet.", "s": "Formula", "v": "clips/056.mp4?v=1793984894"}, {"t": "Four times four counts the sixteen swapped pairs.", "s": "Formula", "v": "clips/057.mp4?v=1793984894"}, {"t": "They cancel the meeting pairs exactly.", "s": "Formula", "v": "clips/058.mp4?v=1793984894"}, {"t": "Leaving twenty.", "s": "Formula", "v": "clips/059.mp4?v=1793984894"}, {"t": "A bijective proof: the only kind a combinatorialist fully trusts.", "s": "Formula", "v": "clips/060.mp4?v=1793984894"}, {"t": "So far, ants on a grid. Now, the general lemma.", "s": "LemmaCard", "v": "clips/061.mp4?v=1793984894"}, {"t": "Martin Aigner and Günter Ziegler begin their chapter on this lemma like this: The essence of mathematics is proving theorems, and so, that is what mathematicians do: they prove theorems.", "s": "BookQuote", "v": "clips/062.mp4?v=1793984894"}, {"t": "But to tell the truth, what they really want to prove, once in their lifetime, is a Lemma.", "s": "BookQuote", "v": "clips/063.mp4?v=1793984894"}, {"t": "And this is one of those lemmas.", "s": "BookQuote", "v": "clips/064.mp4?v=1793984894"}, {"t": "It's called the Lindström–Gessel–Viennot lemma.", "s": "LGVNames", "v": "clips/065.mp4?v=1793984894"}, {"t": "Bernt Lindström found it in 1973, in matroid theory.", "s": "LGVNames", "v": "clips/066.mp4?v=1793984894"}, {"t": "Ira Gessel and Xavier Viennot rediscovered it in 1985, and showed how much it can do.", "s": "LGVNames", "v": "clips/067.mp4?v=1793984894"}, {"t": "Take any one-way network: roads you can only travel in one direction, with no loops.", "s": "GeneralLemma", "v": "clips/068.mp4?v=1793984894"}, {"t": "Pick some starting points, a one up to a n, and the same number of ends, b one up to b n.", "s": "GeneralLemma", "v": "clips/069.mp4?v=1793984894"}, {"t": "Build a matrix M: the entry in row i, column j counts the paths from a i to b j. From a one to b two, there are four.", "s": "GeneralLemma", "v": "clips/070.mp4?v=1793984894"}, {"t": "Then the determinant of M counts the families of paths, a one to b one, all the way to a n to b n, that never touch.", "s": "GeneralLemma", "v": "clips/071.mp4?v=1793984894"}, {"t": "As long as, like on our grid, any crossed pairing is forced to touch. Here, the determinant is thirteen: exactly thirteen families that never touch.", "s": "GeneralLemma", "v": "clips/072.mp4?v=1793984894"}, {"t": "So any puzzle that is secretly a family of paths that never touch, a determinant can count.", "s": "PatternCard", "v": "clips/073.mp4?v=1793984894"}, {"t": "Does the pattern repeat? Let's look.", "s": "PatternCard", "v": "clips/074.mp4?v=1793984894"}, {"t": "Take a hexagon, cut into little triangles.", "s": "Hexagon", "v": "clips/075.mp4?v=1793984894"}, {"t": "Glue two neighbours together and you get a tile. Tiles point in three directions.", "s": "Hexagon", "v": "clips/076.mp4?v=1793984894"}, {"t": "Now cover the hexagon with tiles: no gaps, no overlaps. Notice anything? It looks like a stack of boxes.", "s": "Hexagon", "v": "clips/077.mp4?v=1793984894"}, {"t": "It's completely flat. Your brain is doing the 3D for free.", "s": "Hexagon", "v": "clips/078.mp4?v=1793984894"}, {"t": "How many ways can you tile it?", "s": "Hexagon", "v": "clips/079.mp4?v=1793984894"}, {"t": "Fade out the flat tiles. The others link up into chains, from left to right.", "s": "Hexagon", "v": "clips/080.mp4?v=1793984894"}, {"t": "Tiles never overlap, so the chains never touch.", "s": "Hexagon", "v": "clips/081.mp4?v=1793984894"}, {"t": "Now squash the hexagon onto our grid, and the two chains become our two ants.", "s": "Hexagon", "v": "clips/082.mp4?v=1793984894"}, {"t": "So there are twenty tilings. All this time, our ants were tiling a hexagon.", "s": "Hexagon", "v": "clips/083.mp4?v=1793984894"}, {"t": "Seen in 3D, a tiling is a stack of boxes in a corner, each stack no taller than the ones behind it.", "s": "BoxesCorner", "v": "clips/084.mp4?v=1793984894"}, {"t": "A bigger box, three by three by three, gives a bigger hexagon and three chains: three ants that never meet.", "s": "BoxesCorner", "v": "clips/085.mp4?v=1793984894"}, {"t": "A three-by-three determinant counts them: nine hundred and eighty.", "s": "BoxesCorner", "v": "clips/086.mp4?v=1793984894"}, {"t": "Percy MacMahon found a formula for every box, over a century ago. Combinatorialists call these plane partitions.", "s": "BoxesCorner", "v": "clips/087.mp4?v=1793984894"}, {"t": "Another disguise. A mountain range: each step goes up or down, and it never dips below sea level.", "s": "CatalanMountains", "v": "clips/088.mp4?v=1793984894"}, {"t": "How many ways can you draw two ranges, one inside the other, without touching?", "s": "CatalanMountains", "v": "clips/089.mp4?v=1793984894"}, {"t": "A single range is counted by the Catalan numbers. Put four of them in a two-by-two table: the determinant is three.", "s": "CatalanMountains", "v": "clips/090.mp4?v=1793984894"}, {"t": "And here they are. Exactly three.", "s": "CatalanMountains", "v": "clips/091.mp4?v=1793984894"}, {"t": "And one more, a beauty. This is an Aztec diamond: rows of two, four, six squares, and back down.", "s": "AztecIntro", "v": "clips/092.mp4?v=1793984894"}, {"t": "Tile it with dominoes. The smallest one has two tilings. The next has eight. The next, sixty-four.", "s": "AztecIntro", "v": "clips/093.mp4?v=1793984894"}, {"t": "Guess the next one.", "s": "AztecIntro", "v": "clips/094.mp4?v=1793984894"}, {"t": "One thousand and twenty-four. Powers of two, every time. That's suspicious.", "s": "AztecIntro", "v": "clips/095.mp4?v=1793984894"}, {"t": "Colour the board like a chessboard, and there are four kinds of domino. Give each kind a job: a flat step, a step up, a step down, or nothing.", "s": "AztecPaths", "v": "clips/096.mp4?v=1793984894"}, {"t": "Now the dominoes link up into paths, from the left side to the right. Dominoes never overlap, so the paths never touch, and every such family comes from exactly one tiling.", "s": "AztecPaths", "v": "clips/097.mp4?v=1793984894"}, {"t": "So once again: count routes, take the determinant. Twelve times two minus four times four. Eight.", "s": "AztecPaths", "v": "clips/098.mp4?v=1793984894"}, {"t": "One size up: sixty-four.", "s": "AztecPaths", "v": "clips/099.mp4?v=1793984894"}, {"t": "In general, order n gives two to the n times n plus one over two. A determinant, hiding in a pile of dominoes.", "s": "AztecPaths", "v": "clips/100.mp4?v=1793984894"}, {"t": "Now pick one tiling at random, every tiling equally likely, on a big diamond, and let it grow.", "s": "ArcticCircle", "v": "clips/101.mp4?v=1793984894"}, {"t": "This is order sixty.", "s": "ArcticCircle", "v": "clips/102.mp4?v=1793984894"}, {"t": "The corners freeze into brick walls. The middle is chaos. And as the diamond grows, the boundary between them becomes a perfect circle.", "s": "ArcticCircle", "v": "clips/103.mp4?v=1793984894"}, {"t": "It's called the arctic circle theorem.", "s": "ArcticCircle", "v": "clips/104.mp4?v=1793984894"}, {"t": "Back to the chessboard from the start. Dominoes aren't paths, but there's a determinant trick here too. Shrink it to a two-by-three board: three tilings.", "s": "SmallBoard2", "v": "clips/105.mp4?v=1793984894"}, {"t": "A domino joins a black square to a white neighbour. Write a one wherever they touch. Each tiling picks one entry in every row and every column: one term of the determinant.", "s": "SmallBoard2", "v": "clips/106.mp4?v=1793984894"}, {"t": "If determinants count pairings, this should give three. It gives minus one.", "s": "SmallBoard2", "v": "clips/107.mp4?v=1793984894"}, {"t": "The terms come with signs: plus for this one, minus for these two. Here the cancellation eats the good ones.", "s": "SmallBoard2", "v": "clips/108.mp4?v=1793984894"}, {"t": "In 1961 the physicist Pieter Kasteleyn had an idea: if the signs don't cancel the way you want, change the signs.", "s": "SignFix2", "v": "clips/109.mp4?v=1793984894"}, {"t": "Put a minus sign on this one edge. Only the all-vertical tiling uses it, so only its sign flips.", "s": "SignFix2", "v": "clips/110.mp4?v=1793984894"}, {"t": "Now every tiling carries the same sign. The determinant is minus three. Ignore the sign: three.", "s": "SignFix2", "v": "clips/111.mp4?v=1793984894"}, {"t": "On a four-by-four board, the plain determinant says there are zero tilings. Very confident, very wrong.", "s": "Board4x4", "v": "clips/112.mp4?v=1793984894"}, {"t": "Put minus signs on the vertical edges of every other column, and the determinant gives thirty-six. Exactly right.", "s": "Board4x4", "v": "clips/113.mp4?v=1793984894"}, {"t": "Now the full chessboard: twelve million, nine hundred eighty-eight thousand, eight hundred sixteen. The five-month count, in an instant.", "s": "FKT", "v": "clips/114.mp4?v=1793984894"}, {"t": "The rule behind it: every little loop of four edges carries an odd number of minus signs.", "s": "FKT", "v": "clips/115.mp4?v=1793984894"}, {"t": "And it's not really about chessboards. Squares are vertices, dominoes are edges, and a tiling is a perfect matching.", "s": "FKT", "v": "clips/116.mp4?v=1793984894"}, {"t": "Kasteleyn, Temperley and Fisher made this work for any graph you can draw without crossings: the FKT algorithm counts perfect matchings of planar graphs in polynomial time.", "s": "FKT", "v": "clips/117.mp4?v=1793984894"}, {"t": "When a physicist needs to count twelve million tilings, they don't count. They take a determinant, and then let the board go to infinity.", "s": "FKT", "v": "clips/118.mp4?v=1793984894"}, {"t": "Let's step back. Ants that never meet. Tilings of a hexagon. Boxes in a corner. Mountain ranges. Aztec diamonds. Chessboards.", "s": "Map", "v": "clips/119.mp4?v=1793984894"}, {"t": "All counted by one determinant each.", "s": "Map", "v": "clips/120.mp4?v=1793984894"}, {"t": "And it's the same trick every time. Count everything, good and bad, each with a sign.", "s": "Finale", "v": "clips/121.mp4?v=1793984894"}, {"t": "The bad ones pair up with opposite signs, and cancel. What's left is exactly what you wanted.", "s": "Finale", "v": "clips/122.mp4?v=1793984894"}, {"t": "For a computer scientist, that's remarkable. Counting is usually hopeless: counting perfect matchings of a general graph is sharp-P complete. That's Valiant, in 1979.", "s": "Finale", "v": "clips/123.mp4?v=1793984894"}, {"t": "But if your puzzle turns into non-touching paths, or a matching on a planar graph, it becomes one determinant, and polynomial time.", "s": "Finale", "v": "clips/124.mp4?v=1793984894"}, {"t": "Determinants can count, because minus signs can cancel.", "s": "Finale", "v": "clips/125.mp4?v=1793984894"}, {"t": "As for our ants: they can finally go home in peace. Twenty ways home, and they never had to meet.", "s": "Goodbye", "v": "clips/126.mp4?v=1793984894"}, {"t": "Thanks for watching.", "s": "Goodbye", "v": "clips/127.mp4?v=1793984894"}, {"t": "", "s": "Credits", "v": "clips/128.mp4?v=1793984894"}];let i=0,showNext=false;const v=document.getElementById('v'),pre=document.createElement('video');pre.muted=true;pre.preload='auto';let started=false,muted=false;
